name: Teste de Ping 

# Define quando o script será executado
on:
  push:
    branches: [ "main" ]  # Executa sempre que houver um push na main
  workflow_dispatch:      # Permite rodar o script manualmente pelo painel do GitHub

jobs:
  ping-and-push:
    runs-on: ubuntu-latest

    # Permissões necessárias para fazer o push de volta ao repositório
    permissions:
      contents: write

    steps:
    # 1. Faz o checkout do código do repositório
    - name: Checkout do código
      uses: actions/checkout@v4

    # 2. Executa o teste de ping e gera o arquivo de log
    - name: Executar Ping no Google
      run: |
        echo "=== Teste de Ping realizado em $(date) ===" > resultado_ping.txt
        ping -c 4 google.com >> resultado_ping.txt

    # 3. Configura o Git, adiciona o arquivo, faz o commit e o push
    - name: Commitar e Commitar alterações
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Adiciona o arquivo gerado
        git add resultado_ping.txt
        
        # Verifica se há alterações para evitar erros caso o arquivo seja idêntico (embora o timestamp mude)
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore: atualiza log de teste de ping [skip ci]"
          git push origin main
        else
          echo "Nenhuma alteração detectada no log."
        fi
