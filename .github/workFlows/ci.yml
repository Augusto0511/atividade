name: Ping Google and Push

on:
  push:
    branches:
     - main
  workflow_dispatch: # Permite rodar manualmente pelo painel

jobs:
  ping-job:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permissão necessária para fazer o push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Ping Google and Generate Log
      run: |
        echo "=== Executando Ping ==="
        ping -c 4 google.com > ping_log.txt
        echo "Última atualização: $(date)" >> ping_log.txt

    - name: Commit and Push changes
      run: |
        # 1. Correção do e-mail oficial do bot do GitHub
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add ping_log.txt
        
        if ! git diff-index --quiet HEAD; then
          # 2. Adicionado [skip ci] para que o push do bot NÃO ative o workflow de novo
          git commit -m "Automated: Ping Google log update $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
          git push origin main
        else
          echo "Nenhuma alteração detectada no log."
        fi
