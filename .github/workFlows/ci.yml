name: Ping Google

on:
  push:
    branches:
     - main
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub Actions

jobs:
  # JOB 1: Testar a conectividade direta com o IP do DNS do Google
  dns-ping-job:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Ping Google DNS IP
      run: |
        echo "=== Testando conexão direta com o DNS do Google (8.8.8.8) ==="
        ping -c 4 8.8.8.8 > dns_ping_log.txt
        echo "Última verificação de Ping: $(date)" >> dns_ping_log.txt

    - name: Salvar log do Ping
      uses: actions/upload-artifact@v4
      with:
        name: dns-ping-result
        path: dns_ping_log.txt

  # JOB 2: Testar a resolução de nomes usando o servidor do Google (Depende do JOB 1)
  dns-resolve-job:
    runs-on: ubuntu-latest
    needs: dns-ping-job # ⬅️ Só inicia se o 'dns-ping-job' der sucesso
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Test DNS Resolution
      run: |
        echo "=== Testando resolução de nomes via nslookup ==="
        # Consulta o domínio usando especificamente o servidor 8.8.8.8
        nslookup google.com 8.8.8.8 > dns_resolve_log.txt
        echo "Última verificação de Resolução: $(date)" >> dns_resolve_log.txt

    - name: Salvar log da Resolução
      uses: actions/upload-artifact@v4
      with:
        name: dns-resolve-result
        path: dns_resolve_log.txt

  # JOB 3: Envia os resultados para a branch main (Depende do JOB 2)
  commit-and-push:
    runs-on: ubuntu-latest
    needs: dns-resolve-job # ⬅️ Só inicia se o 'dns-resolve-job' der sucesso
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Baixar todos os logs de DNS anteriores
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Adiciona os dois novos arquivos de log focados em DNS
        git add dns_ping_log.txt dns_resolve_log.txt
        
        if ! git diff-index --quiet HEAD; then
          # O [skip ci] evita o loop infinito ao fazer push na branch monitorada
          git commit -m "Automated: Google DNS diagnostics update $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
          git push origin main
        else
          echo "Nenhuma alteração detectada nos logs de DNS."
        fi
